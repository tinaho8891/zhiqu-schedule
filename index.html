<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智取店排班系統</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="智取排班">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="icon.svg" alt="" width="28" height="28">
    <span>智取店排班系統</span>
  </div>
  <div class="month-nav">
    <button class="icon-btn" id="prevMonth" aria-label="上個月">‹</button>
    <span id="monthLabel">—</span>
    <button class="icon-btn" id="nextMonth" aria-label="下個月">›</button>
  </div>
  <div class="user-box" id="userBox"></div>
</header>

<div id="banner" class="banner" hidden></div>

<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active">漏排總覽</button>
  <button data-tab="grid">排班表</button>
  <button data-tab="day">單日調度</button>
  <button data-tab="settings" data-admin>設定</button>
</nav>

<main id="main">
  <div class="loading">載入中…</div>
</main>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js?v=2"></script>
</body>
</html>
